<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E382B" />
      <stop offset="60%" stop-color="#2D5A43" />
      <stop offset="100%" stop-color="#417359" />
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234232" />
      <stop offset="100%" stop-color="#182E23" />
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3528" />
      <stop offset="100%" stop-color="#0F1F17" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C5E32" />
      <stop offset="30%" stop-color="#6E4420" />
      <stop offset="100%" stop-color="#3D2510" />
    </linearGradient>
    <linearGradient id="machineYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Sun / Warm morning light in mountains -->
  <circle cx="850" cy="220" r="140" fill="#FEF3C7" opacity="0.3" filter="blur(30px)" />
  <circle cx="850" cy="220" r="70" fill="#FDE68A" opacity="0.5" />

  <!-- Distant Mountains (Jotunheimen / Valdres peaks) -->
  <polygon points="100,500 320,240 500,440" fill="url(#mountainBack)" opacity="0.7" />
  <polygon points="380,480 620,180 840,460" fill="url(#mountainBack)" opacity="0.8" />
  <polygon points="720,490 980,210 1200,470" fill="url(#mountainBack)" opacity="0.6" />

  <!-- Mountain snowcaps -->
  <polygon points="320,240 280,290 310,285 325,300 355,280" fill="#F3F4F6" opacity="0.6" />
  <polygon points="620,180 570,245 610,235 635,260 670,240" fill="#F3F4F6" opacity="0.75" />
  <polygon points="980,210 940,265 970,255 990,270 1020,250" fill="#F3F4F6" opacity="0.65" />

  <!-- Midground Mountain Ridge -->
  <polygon points="-50,600 240,360 520,580" fill="url(#mountainMid)" />
  <polygon points="460,580 780,310 1150,590" fill="url(#mountainMid)" />
  <polygon points="850,600 1100,380 1250,560" fill="url(#mountainMid)" />

  <!-- Ground / Excavation Plateau -->
  <path d="M-50,620 L350,580 L750,590 L1250,560 L1250,850 L-50,850 Z" fill="url(#groundGrad)" />

  <!-- Rocks, gravel & terrain layers -->
  <ellipse cx="200" cy="680" rx="90" ry="25" fill="#523214" opacity="0.6" />
  <ellipse cx="450" cy="710" rx="140" ry="35" fill="#42250E" opacity="0.5" />
  <ellipse cx="900" cy="690" rx="160" ry="40" fill="#42250E" opacity="0.6" />
  <polygon points="760,650 810,610 870,640 850,660" fill="#78716C" />
  <polygon points="820,670 880,630 940,665 910,690" fill="#57534E" />
  <polygon points="700,680 750,640 790,675" fill="#A8A29E" />

  <!-- Excavator (Gravemaskin) -->
  <g transform="translate(380, 360)">
    <!-- Undercarriage / Belter -->
    <rect x="50" y="240" width="280" height="45" rx="20" fill="#1F2937" stroke="#111827" stroke-width="6" />
    <circle cx="85" cy="262" r="14" fill="#4B5563" />
    <circle cx="130" cy="262" r="14" fill="#4B5563" />
    <circle cx="175" cy="262" r="14" fill="#4B5563" />
    <circle cx="220" cy="262" r="14" fill="#4B5563" />
    <circle cx="265" cy="262" r="14" fill="#4B5563" />
    <circle cx="295" cy="262" r="14" fill="#374151" />

    <!-- Slewing Platform & Body -->
    <rect x="60" y="160" width="220" height="80" rx="16" fill="url(#machineYellow)" stroke="#B45309" stroke-width="4" />
    <!-- Engine Compartment / Counterweight -->
    <rect x="60" y="140" width="85" height="100" rx="12" fill="#B45309" />
    <line x1="75" y1="160" x2="75" y2="210" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
    <line x1="90" y1="160" x2="90" y2="210" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
    <line x1="105" y1="160" x2="105" y2="210" stroke="#78350F" stroke-width="4" stroke-linecap="round" />

    <!-- Operator Cab -->
    <path d="M160,160 L160,90 Q160,80 170,80 L230,80 Q245,80 250,95 L270,160 Z" fill="#111827" stroke="#374151" stroke-width="4" />
    <!-- Cab Glass -->
    <path d="M170,92 L225,92 Q235,92 240,102 L255,150 L170,150 Z" fill="#93C5FD" opacity="0.75" />

    <!-- Boom (Hovedbom) -->
    <path d="M240,180 L350,40 Q360,25 380,35 L400,50 Q410,65 395,85 L300,210 Z" fill="url(#machineYellow)" stroke="#B45309" stroke-width="3" />
    <!-- Hydraulic Cylinder Boom -->
    <line x1="260" y1="195" x2="340" y2="105" stroke="#9CA3AF" stroke-width="12" stroke-linecap="round" />
    <line x1="300" y1="150" x2="360" y2="85" stroke="#4B5563" stroke-width="18" stroke-linecap="round" />

    <!-- Arm / Stick (Stikke) -->
    <path d="M375,45 L500,160 Q510,170 500,185 L480,195 Q465,200 455,185 L355,75 Z" fill="url(#machineYellow)" stroke="#B45309" stroke-width="3" />
    <!-- Hydraulic Cylinder Arm -->
    <line x1="340" y1="50" x2="430" y2="120" stroke="#9CA3AF" stroke-width="8" stroke-linecap="round" />

    <!-- Bucket (Skuffe) -->
    <path d="M490,185 L530,225 L500,270 L445,260 L455,210 Z" fill="url(#metalDark)" stroke="#111827" stroke-width="4" />
    <!-- Bucket Teeth -->
    <polygon points="500,270 520,290 510,272" fill="#D1D5DB" />
    <polygon points="485,268 502,288 493,270" fill="#D1D5DB" />
    <polygon points="470,265 485,285 476,267" fill="#D1D5DB" />

    <!-- Ground shadow under machine -->
    <ellipse cx="200" cy="285" rx="180" ry="18" fill="#1C1917" opacity="0.4" />
  </g>

  <!-- Foreground Detail / Quality Badge Banner -->
  <rect x="0" y="780" width="1200" height="20" fill="#0A1610" opacity="0.5" />
</svg>
